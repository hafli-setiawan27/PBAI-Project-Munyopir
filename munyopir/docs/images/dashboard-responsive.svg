    <rect x="300" y="438" width="226" height="88" rx="17" class="card"/><circle cx="332" cy="482" r="19" fill="#f2efff"/><path d="M324 473h16v18h-16zM328 478h8m-8 5h8" fill="none" stroke="#4a2fd4" stroke-width="2"/><text x="362" y="478" class="body" font-size="14" font-weight="800">Catat biaya</text><text x="362" y="499" class="muted small">Simpan transaksi</text>
    <rect x="538" y="438" width="226" height="88" rx="17" class="card"/><circle cx="570" cy="482" r="19" fill="#ecfdf5"/><circle cx="570" cy="482" r="8" fill="none" stroke="#047857" stroke-width="2"/><path d="M570 469v4m0 18v4m-13-13h4m18 0h4" stroke="#047857" stroke-width="2"/><text x="600" y="478" class="body" font-size="14" font-weight="800">Tambah servis</text><text x="600" y="499" class="muted small">Atur perawatan rutin</text>
    <rect x="776" y="438" width="240" height="88" rx="17" class="card"/><circle cx="808" cy="482" r="19" fill="#f1f3f9"/><path d="M797 481h22m-17-7h12v14h-12z" fill="none" stroke="#22355f" stroke-width="2"/><text x="838" y="478" class="body" font-size="14" font-weight="800">Perbarui km</text><text x="838" y="499" class="muted small">Catat odometer</text>
  </g>

