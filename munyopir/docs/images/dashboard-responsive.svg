  <rect x="1128" y="822" width="350" height="47" rx="11" fill="#f1f6ff"/><path d="M1142 856c34-30 61 20 96-5s60 19 92-7" fill="none" stroke="#527bf0" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/><circle cx="1144" cy="854" r="6" fill="#fff" stroke="#527bf0" stroke-width="2"/><path d="M1443 839c0 7-8 15-8 15s-8-8-8-15a8 8 0 1 1 16 0Z" fill="#5b3df5"/>
  <text x="1130" y="892" class="body" font-size="13" font-weight="800">RSUD Rokan Hulu</text><text x="1130" y="916" class="muted" font-size="11">20 Nov 2026 · 09.00 WIB</text>

  <rect x="1094" y="966" width="418" height="103" rx="0" fill="#fff"/><path d="M1094 966h418" stroke="#e2e6f2"/>
