  <path d="M1180 668h160l-14-21a11 11 0 0 0-10-6h-35l-18-13h-47a12 12 0 0 0-11 7l-13 21h-12z" fill="#7398fa"/><circle cx="1207" cy="671" r="11" fill="#0e1a3a"/><circle cx="1207" cy="671" r="5" fill="#f5f8ff"/><circle cx="1312" cy="671" r="11" fill="#0e1a3a"/><circle cx="1312" cy="671" r="5" fill="#f5f8ff"/>
  <text x="1130" y="710" class="body" font-size="13" font-weight="800">Toyota Avanza</text><text x="1130" y="735" class="muted" font-size="11">BM 1234 XX · 48.200 km</text>

  <text x="1116" y="797" class="body" font-size="16" font-weight="800">Perjalanan mendatang</text>
