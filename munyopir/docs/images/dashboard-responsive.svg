  <rect x="1114" y="492" width="181" height="72" rx="15" class="card"/><circle cx="1140" cy="528" r="15" fill="#ecfdf5"/><circle cx="1140" cy="528" r="7" fill="none" stroke="#047857" stroke-width="2"/><text x="1164" y="525" class="body" font-size="12" font-weight="800">Tambah servis</text><text x="1164" y="543" class="muted" font-size="10">Perawatan rutin</text>
  <rect x="1305" y="492" width="187" height="72" rx="15" class="card"/><circle cx="1331" cy="528" r="15" fill="#f1f3f9"/><path d="M1323 527h16m-12-6h9v12h-9z" fill="none" stroke="#22355f" stroke-width="2"/><text x="1355" y="525" class="body" font-size="12" font-weight="800">Perbarui km</text><text x="1355" y="543" class="muted" font-size="10">Odometer</text>

