<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1120" role="img" aria-labelledby="title description">
  <title id="title">Pratinjau dashboard Munyopir desktop dan mobile</title>
  <desc id="description">Ilustrasi dashboard dengan carousel fitur, aksi cepat, ringkasan kendaraan, jadwal perjalanan, dan navigasi bawah mobile.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1a3a"/><stop offset="1" stop-color="#28205f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17284c" flood-opacity=".12"/></filter>
    <style>
      .body{font-family:Inter,Arial,sans-serif;fill:#08122b}.muted{fill:#506293}.small{font-size:13px}.label{font-size:12px;font-weight:700;letter-spacing:.08em}.title{font-size:23px;font-weight:800}.card{fill:#fff;stroke:#e2e6f2}.nav{font-size:13px;font-weight:700;fill:#22355f}.button{fill:#0e1a3a}.buttonText{font-size:13px;font-weight:700;fill:#fff}.white{fill:#fff}.accent{fill:#7398fa}.green{fill:#047857}
    </style>
  </defs>
  <rect width="1560" height="1120" rx="28" fill="#f5f8ff"/>
  <text x="44" y="48" class="body" font-size="22" font-weight="800">Munyopir · Dashboard responsif</text>

  <!-- Desktop dashboard -->
  <rect x="34" y="76" width="1010" height="1008" rx="24" fill="#fff" stroke="#dce4f2" filter="url(#shadow)"/>
  <rect x="34" y="76" width="1010" height="72" rx="24" fill="#fff"/>
  <path d="M34 124h1010v24H34z" fill="#fff"/>
  <circle cx="70" cy="111" r="17" fill="#0e1a3a"/><path d="M70 97v28m-14-14h28" stroke="#7398fa" stroke-width="4" stroke-linecap="round"/>
  <text x="98" y="108" class="body" font-size="18" font-weight="800">munyopir</text><text x="98" y="126" class="muted" font-size="11">Asisten digital sopir pribadi</text>
  <text x="395" y="116" class="nav">Beranda</text><text x="493" y="116" class="nav">Perjalanan</text><text x="600" y="116" class="nav">Pengeluaran</text><text x="720" y="116" class="nav">Perawatan</text><text x="817" y="116" class="nav">Kendaraan</text>
  <circle cx="958" cy="111" r="19" fill="#f1f3f9"/><path d="M958 101v12m-6-6h12" stroke="#22355f" stroke-width="2" stroke-linecap="round"/>

  <rect x="62" y="170" width="954" height="208" rx="22" fill="url(#hero)"/>
  <text x="92" y="208" fill="#98b9ff" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">RUANG KERJA ANDA</text>
  <text x="92" y="253" class="white" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="800">Atur jadwal perjalanan</text>
  <text x="92" y="282" fill="#e2e6f2" font-family="Inter,Arial,sans-serif" font-size="15">Catat lokasi jemput, tujuan, dan waktu perjalanan dengan rapi.</text>
  <rect x="92" y="312" width="136" height="38" rx="11" fill="#7398fa"/><text x="111" y="336" class="buttonText">Buat jadwal</text>
  <circle cx="895" cy="274" r="67" fill="#17284c"/><path d="M895 327s39-34 39-70a39 39 0 1 0-78 0c0 36 39 70 39 70Z" fill="#7398fa"/><circle cx="895" cy="257" r="13" fill="#0e1a3a"/>

