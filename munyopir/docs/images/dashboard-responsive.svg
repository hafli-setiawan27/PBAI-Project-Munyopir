  <text x="84" y="716" class="body" font-size="15" font-weight="800">Kendaraan Anda</text><text x="84" y="741" class="muted small">Toyota Avanza · BM 1234 XX</text><text x="84" y="764" class="muted small">Odometer</text><text x="422" y="758" class="body" font-size="15" font-weight="800">48.200 km</text>

