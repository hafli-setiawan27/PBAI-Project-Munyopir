  <text x="568" y="716" class="body" font-size="15" font-weight="800">RSUD Rokan Hulu</text><text x="568" y="741" class="muted small">Jemput di Pasar Modern</text><text x="568" y="764" class="muted small">20 Nov 2026 · 09.00 WIB</text>

