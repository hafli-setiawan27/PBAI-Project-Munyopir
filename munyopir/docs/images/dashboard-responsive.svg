  <text x="1136" y="215" fill="#98b9ff" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">RUANG KERJA ANDA</text>
  <text x="1136" y="251" class="white" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">Atur jadwal</text><text x="1136" y="278" class="white" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">perjalanan</text>
  <text x="1136" y="307" fill="#e2e6f2" font-family="Inter,Arial,sans-serif" font-size="12">Catat tujuan dan waktu jemput.</text>
  <rect x="1136" y="323" width="115" height="27" rx="8" fill="#7398fa"/><text x="1153" y="341" class="buttonText" font-size="11">Buat jadwal</text>

  <text x="1116" y="396" class="body" font-size="16" font-weight="800">Aksi cepat</text>
